name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, private logs, and customer data before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe configuration and command that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevLoop and Python versions
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details

